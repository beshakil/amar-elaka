name: amar_elaka_app
description: 'Amar Elaka — hyperlocal multi-tenant platform, Flutter client.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  dio: ^5.11.1
  drift: ^2.35.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  drift_flutter: ^0.3.1
  amar_elaka_api:
    path: ../../packages/shared-types/dart
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  # On-device WebP compression before upload (media pipeline): users pay for data.
  flutter_image_compress: ^2.4.0
  # Persistent upload queue files survive an app restart.
  path_provider: ^2.1.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  generate: true
  # A single variable font (wdth/wght axes) covers every weight below plus
  # basic Latin — see docs/decisions/002-mobile-app-architecture.md and
  # lib/core/design/tokens/app_typography.dart.
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 700
