name: amar_elaka_app
description: 'Amar Elaka — hyperlocal multi-tenant platform, Flutter client.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  dio: ^5.11.1
  drift: ^2.35.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  drift_flutter: ^0.3.1
  amar_elaka_api:
    path: ../../packages/shared-types/dart
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.3.1
  image_picker: ^1.2.3
  # On-device WebP compression before upload (media pipeline): users pay for data.
  flutter_image_compress: ^2.4.0
  # Persistent upload queue files survive an app restart.
  path_provider: ^2.1.5
  crypto: ^3.0.7
  # The base map: MapLibre Native (Android SDK 13.5) over our own Bangladesh
  # .pmtiles archive, styled by packages/map-style (assets/map), Bengali
  # shaped from font files via `font-faces` (lib/core/map/, ADR 043).
  maplibre_gl: ^0.27.1
  # Feed and detail photos: disk + memory cache, decoded at display size
  # (memCacheWidth) so lists stay cheap on 2 GB phones.
  cached_network_image: ^4.0.2
  # Call / WhatsApp / SMS after the contact reveal (tel:, whatsapp://, wa.me).
  url_launcher: ^6.3.2
  # The system share sheet for a post's /s/:code link.
  share_plus: ^13.3.0
  # Decodes the API's thumbhash placeholders (pure Dart, tiny).
  thumbhash: ^0.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  # The post flow's happy path on a device (integration_test/).
  integration_test:
    sdk: flutter
  # Frame timings for the feed scroll profile (test_driver/perf_driver.dart,
  # ADR 038). Part of the Flutter SDK, not a pub package.
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  # The base map styles, generated by packages/map-style (ADR 043); a test
  # there keeps these copies identical to the package's.
  assets:
    - assets/map/
  # A single variable font (wdth/wght axes) covers every weight below plus
  # basic Latin — see docs/decisions/002-mobile-app-architecture.md and
  # lib/core/design/tokens/app_typography.dart.
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali[wdth,wght].ttf
          weight: 700
