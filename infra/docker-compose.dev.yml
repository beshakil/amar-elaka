name: amar-elaka-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ae_dev
      POSTGRES_PASSWORD: ae_dev_pass
      POSTGRES_DB: amar_elaka
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ae_dev -d amar_elaka']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ae-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: ae-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ae_dev_meili_master_key_change_me
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ae-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  adminer:
    image: adminer:latest
    container_name: ae-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  minio:
    image: minio/minio:latest
    container_name: ae-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ae_dev_minio
      MINIO_ROOT_PASSWORD: ae_dev_minio_secret_change_me
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the media/documents buckets (see StorageService,
  # apps/api/src/storage) so they exist on first `make up`, and makes the
  # media bucket anonymously readable — it serves public post photos/avatars,
  # unlike the private documents bucket used for verification papers.
  minio-init:
    image: minio/mc:latest
    container_name: ae-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ae_dev_minio ae_dev_minio_secret_change_me &&
        mc mb --ignore-existing local/amar-elaka-media-dev &&
        mc mb --ignore-existing local/amar-elaka-documents-dev &&
        mc anonymous set download local/amar-elaka-media-dev
      "

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
