name: amar-elaka-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ae-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ae_dev
      POSTGRES_PASSWORD: ae_dev_pass
      POSTGRES_DB: amar_elaka
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ae_dev -d amar_elaka']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ae-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: ae-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ae_dev_meili_master_key_change_me
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ae-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  adminer:
    image: adminer:latest
    container_name: ae-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # No local object storage: MinIO's images are gone from Docker Hub, and dev
  # talks to real Contabo Object Storage in its own *-dev buckets (ADR 027).
  # Configure S3_* / STORAGE_PUBLIC_URL in .env, then run
  # `pnpm --filter @amar-elaka/api storage:check`.

volumes:
  pgdata:
  redisdata:
  meilidata:
